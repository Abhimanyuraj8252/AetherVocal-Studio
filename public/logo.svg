<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="800" height="200" rx="24" fill="url(#bgGrad)" />

  <!-- Logo Mark Icon -->
  <g transform="translate(30, 20) scale(0.3125)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#090d16" stroke="url(#logoGlow)" stroke-width="12" />
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#logoGlow)" stroke-width="4" opacity="0.4" />
    <rect x="156" y="210" width="18" height="92" rx="9" fill="url(#accentGlow)" />
    <rect x="194" y="150" width="18" height="212" rx="9" fill="url(#logoGlow)" />
    <rect x="247" y="100" width="18" height="312" rx="9" fill="url(#logoGlow)" />
    <rect x="300" y="150" width="18" height="212" rx="9" fill="url(#logoGlow)" />
    <rect x="338" y="210" width="18" height="92" rx="9" fill="url(#accentGlow)" />
    <path d="M 165 260 Q 256 220 347 260" fill="none" stroke="url(#accentGlow)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Text Brand -->
  <text x="210" y="115" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">
    AetherVocal <tspan fill="url(#logoGlow)">Studio</tspan>
  </text>
  <text x="212" y="155" font-family="'Inter', sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="1">
    UNLIMITED HINDI &amp; ENGLISH TEXT TO SPEECH
  </text>
</svg>
